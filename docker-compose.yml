version: '3.8'

services:
  db:
    image: postgres:15
    container_name: useshop_db
    restart: always
    environment:
      POSTGRES_USER: useshop_user
      POSTGRES_PASSWORD: useshop_password
      POSTGRES_DB: useshop_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: useshop_redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  pgdata:
